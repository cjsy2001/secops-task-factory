title = "secops-task-factory"

[extend]
useDefault = true

[[allowlists]]
description = "test fixtures that deliberately look like secrets (the plane's secret-refusal tests)"
paths = ['''tools/stf-mcp/tests/.*\.test\.ts''']

[[allowlists]]
description = "stf plane session ids are random UUIDs, not credentials — only this exact field shape is exempt"
regexTarget = "line"
regexes = ['''"run_key": ?"(lifecycle|implement|analyze|other)-(\d{3}|x)-\d{8}-\d+"''', '''"session_id": ?"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''', '''"emitted_session": ?"[0-9a-f-]{36}"''']
